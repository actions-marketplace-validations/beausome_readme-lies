name: readme-lies
description: Find claims in your docs that are no longer true - broken commands, dead paths, license drift.
branding:
  icon: alert-triangle
  color: yellow

inputs:
  path:
    description: Repository root to check.
    required: false
    default: "."
  glob:
    description: Document glob. Repeat with newlines for several.
    required: false
    default: ""
  ignore:
    description: Finding codes to suppress, newline separated.
    required: false
    default: ""
  strict:
    description: Fail on warnings as well as errors.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      # Inputs arrive as environment variables rather than being interpolated
      # into the script body. `${{ }}` substitution happens before bash sees the
      # text, so an input containing `; rm -rf /` would otherwise execute.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_GLOB: ${{ inputs.glob }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_STRICT: ${{ inputs.strict }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        python -m pip install --quiet "$ACTION_PATH"

        args=("$INPUT_PATH" --format github)

        # `if` rather than `[ … ] && …`: composite steps run under `set -e`, and
        # a bare test that evaluates false returns 1, which fails the whole step.
        # That bug made the action unusable for anyone leaving strict at its
        # default.
        if [ "$INPUT_STRICT" = "true" ]; then
          args+=(--strict)
        fi

        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then
            args+=(--glob "$pattern")
          fi
        done <<< "$INPUT_GLOB"

        while IFS= read -r code; do
          if [ -n "$code" ]; then
            args+=(--ignore "$code")
          fi
        done <<< "$INPUT_IGNORE"

        readme-lies "${args[@]}"
