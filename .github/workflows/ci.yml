name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  dogfood:
    # If the tool cannot keep its own README honest, it has no business
    # checking anyone else's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: readme-lies --strict --format github

  action:
    # Exercise action.yml the way a consumer does - `uses: ./` - not by calling
    # the CLI directly. Every bug found in the action so far was invisible to a
    # CLI-only test, because composite steps run under `set -eo pipefail` and
    # inputs arrive through a different path.
    name: Action (as a consumer uses it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Happy path, all optional inputs left at their defaults. This is the
      # combination that was broken: a false `strict` failed the step.
      - name: Defaults only
        uses: ./

      # Every input supplied.
      - name: All inputs
        uses: ./
        with:
          path: "."
          strict: "true"
          glob: |
            README.md
          ignore: |
            missing-path

      - name: Build a repo that lies
        run: |
          mkdir -p /tmp/liar
          echo '{"scripts":{"build":"vite build"}}' > /tmp/liar/package.json
          cat > /tmp/liar/README.md <<'MARKDOWN'
          # Liar

          Run it with:

          ~~~bash
          npm run dev
          ~~~
          MARKDOWN
          sed -i 's/^          //' /tmp/liar/README.md
          cat /tmp/liar/README.md

      - name: Must fail on a lying repo
        id: liar
        uses: ./
        continue-on-error: true
        with:
          path: /tmp/liar

      - name: Assert it failed
        run: |
          if [ "${{ steps.liar.outcome }}" != "failure" ]; then
            echo "::error::the action passed a README documenting a script that does not exist"
            exit 1
          fi
          echo "Correctly failed on a lying README."
